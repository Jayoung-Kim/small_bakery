:root{

}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#cfe9f7;font-family:'Jua',system-ui,sans-serif;color:var(--ink);user-select:none;-webkit-user-select:none;touch-action:none}
#game{position:fixed;inset:0}
canvas{display:block}
button{font-family:inherit;color:inherit;cursor:pointer;border:0}
.hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 10px) 12px 0;display:flex;gap:8px;align-items:flex-start;pointer-events:none;z-index:5}
.pill{pointer-events:auto;background:var(--paper);border-radius:999px;padding:7px 14px;box-shadow:var(--shadow);font-size:16px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.lvl{flex-direction:column;align-items:stretch;gap:3px;border-radius:18px;padding:6px 14px}
.lvl .bar{height:7px;border-radius:9px;background:#f1e3cc;overflow:hidden;width:110px}
.lvl .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));width:0}
.sp{flex:1}
.side{position:fixed;right:12px;top:calc(env(safe-area-inset-top) + 114px);display:flex;flex-direction:column;gap:9px;z-index:5}
.ibtn{width:54px;height:54px;border-radius:18px;background:var(--paper);box-shadow:var(--shadow);font-size:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.ibtn small{font-size:10px;margin-top:3px;color:var(--ink2);white-space:nowrap;letter-spacing:-.3px}
.ibtn:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(120,80,40,.18)}
.ibtn .dot{position:absolute;margin:-30px 0 0 34px;width:12px;height:12px;border-radius:50%;background:var(--red);display:none}
#action{position:fixed;right:22px;bottom:calc(env(safe-area-inset-bottom) + 26px);width:96px;height:96px;border-radius:50%;background:var(--accent);color:#fff;font-size:20px;box-shadow:0 7px 0 #d9774a;z-index:6;display:none;text-shadow:0 2px 0 rgba(0,0,0,.12);padding:6px;line-height:1.15}
#action.show{display:block}
#action:active{transform:translateY(4px);box-shadow:0 3px 0 #d9774a}
.hint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 18px);background:rgba(255,253,247,.9);padding:7px 14px;border-radius:999px;font-size:14px;color:var(--ink2);z-index:4;pointer-events:none;white-space:nowrap}
.touch .hint{bottom:calc(env(safe-area-inset-bottom) + 130px)}
#labels{position:fixed;inset:0;pointer-events:none;z-index:3;overflow:hidden}
.bubble{position:absolute;transform:translate(-50%,-100%);background:var(--paper);border-radius:16px;padding:5px 9px 7px;box-shadow:0 4px 0 rgba(120,80,40,.15);font-size:22px;text-align:center;white-space:nowrap}
.bubble:after{content:'';position:absolute;left:50%;bottom:-7px;margin-left:-7px;border:7px solid transparent;border-bottom:0;border-top-color:var(--paper)}
.bubble .pb{height:5px;border-radius:5px;background:#f1e3cc;margin-top:3px;overflow:hidden}
.bubble .pb i{display:block;height:100%;background:var(--green)}
.bubble.say{font-size:14px;max-width:180px;white-space:normal;padding:7px 11px}
.nametag{position:absolute;transform:translate(-50%,-100%);font-size:12px;background:rgba(90,63,46,.7);color:#fff;padding:2px 8px;border-radius:999px;white-space:nowrap}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 118px);transform:translateX(-50%);z-index:20;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
#toast div{background:var(--paper);padding:9px 16px;border-radius:999px;box-shadow:var(--shadow);font-size:15px;animation:pop .25s ease-out;max-width:88vw;text-align:center}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.modal-bg.bottom{align-items:flex-end;background:rgba(80,55,35,.12)}
.modal-bg{position:fixed;inset:0;background:rgba(80,55,35,.35);z-index:30;display:flex;align-items:center;justify-content:center;padding:16px;touch-action:auto}
.modal{background:var(--cream);border-radius:26px;box-shadow:0 10px 0 rgba(120,80,40,.22);width:min(440px,100%);max-height:calc(100% - 20px);overflow:auto;padding:20px 18px 18px;position:relative;animation:pop .2s ease-out;user-select:text;-webkit-user-select:text}
.modal h2{margin:0 0 4px;font-weight:400;font-size:24px;text-align:center}
.modal p.sub{margin:0 0 14px;text-align:center;color:var(--ink2);font-size:14px}
.modal .x{position:absolute;right:12px;top:10px;width:36px;height:36px;border-radius:50%;background:#f3e4cd;font-size:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:9px}
.card{background:var(--paper);border-radius:16px;padding:10px 6px;text-align:center;box-shadow:0 4px 0 var(--line);font-size:14px;display:flex;flex-direction:column;align-items:center;gap:3px}
.card .em{font-size:32px;line-height:1.1}
.card small{color:var(--ink2);font-size:12px}
.card.on{background:#ffe7c2;box-shadow:0 4px 0 #f0c88b,inset 0 0 0 3px var(--accent)}
.card.lock{opacity:.45}
.card:active{transform:translateY(2px)}
.btn{background:var(--accent);color:#fff;border-radius:16px;padding:12px 18px;font-size:18px;box-shadow:0 5px 0 #d9774a;width:100%}
.btn.sec{background:#f3e4cd;color:var(--ink);box-shadow:0 5px 0 #dcc7a7}
.btn.green{background:var(--green);box-shadow:0 5px 0 #58a457}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #d9774a}
.btn:disabled{opacity:.5}
.row{display:flex;gap:9px;margin-top:12px}
input,textarea{font-family:inherit;font-size:17px;width:100%;padding:11px 13px;border-radius:14px;border:2px solid var(--line);background:#fff;color:var(--ink);outline:none;margin-bottom:9px}
input:focus,textarea:focus{border-color:var(--accent)}
.tabs{display:flex;gap:6px;margin-bottom:12px;background:#f3e4cd;padding:4px;border-radius:14px}
.tabs button{flex:1;padding:8px;border-radius:11px;background:transparent;font-size:16px}
.tabs button.on{background:var(--paper);box-shadow:0 2px 0 var(--line)}
.oven-bar{position:relative;height:46px;border-radius:14px;overflow:hidden;display:flex;margin:18px 0 8px;box-shadow:inset 0 0 0 3px #fff}
.oven-bar span{height:100%}
.needle{position:absolute;top:-4px;bottom:-4px;width:6px;margin-left:-3px;background:var(--ink);border-radius:4px}
.legend{display:flex;text-align:center;font-size:12px;color:var(--ink2)}
.big-em{font-size:64px;text-align:center;line-height:1.1;margin:6px 0}
.list{display:flex;flex-direction:column;gap:8px}
.li{background:var(--paper);border-radius:14px;padding:10px 12px;box-shadow:0 3px 0 var(--line);display:flex;align-items:center;gap:10px}
.li .grow{flex:1;min-width:0}
.li small{color:var(--ink2)}
.li button{background:var(--accent);color:#fff;border-radius:11px;padding:8px 12px;font-size:15px;white-space:nowrap}
.swatches{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:6px 0 12px}
.sw{width:36px;height:36px;border-radius:50%;box-shadow:0 3px 0 rgba(0,0,0,.15)}
.sw.on{outline:3px solid var(--accent);outline-offset:2px}
.err{color:#d2513f;font-size:14px;min-height:18px;text-align:center}
.decobar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 150px);display:none;gap:8px;z-index:6;background:rgba(255,253,247,.92);padding:8px;border-radius:18px;box-shadow:var(--shadow)}
.decobar.show{display:flex}
.decobar button{background:#f3e4cd;border-radius:12px;padding:9px 12px;font-size:15px}
.no-touch .decobar{bottom:calc(env(safe-area-inset-bottom) + 64px)}
.visitbar{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top) + 64px);display:none;gap:8px;z-index:6;align-items:center;background:var(--paper);padding:8px 10px 8px 16px;border-radius:999px;box-shadow:var(--shadow);white-space:nowrap}
.visitbar.show{display:flex}
.visitbar button{background:#f3e4cd;border-radius:999px;padding:8px 12px;font-size:15px}
.roomonly{display:none}.inside:not(.visiting) .roomonly{display:flex}
.topctl{position:fixed;right:12px;top:calc(env(safe-area-inset-top) + 60px);display:flex;gap:7px;z-index:6}
.topctl button{width:44px;height:44px;border-radius:14px;background:var(--paper);box-shadow:var(--shadow);font-size:20px;line-height:1}
.topctl button:active{transform:translateY(3px)}
.side.closed{display:none}
.wp{height:54px;width:100%;border-radius:10px;box-shadow:inset 0 0 0 2px rgba(0,0,0,.06)}
.visiting .side .homeonly,.visiting .lvl,.visiting #coins{display:none}
#loading{position:fixed;inset:0;background:#ffe9c7;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-size:22px}
#loading .em{font-size:64px;animation:bob 1s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px)}}
.title-logo{font-size:40px;text-align:center;margin:4px 0 2px;color:#e0784a;text-shadow:0 3px 0 #ffd9a8}
.gb{background:var(--paper);border-radius:14px;padding:9px 12px;box-shadow:0 3px 0 var(--line);font-size:15px}
.gb small{color:var(--ink2);display:block;font-size:12px;margin-bottom:2px}
@media (max-width:520px){.ibtn{width:48px;height:48px;font-size:21px;border-radius:15px}.side{gap:7px}.ibtn small{font-size:9px}
.lvl .bar{width:70px}.pill{font-size:14px;padding:6px 11px}}
</style>
</head>

const grad = (() => {
  const d = new Uint8Array([120,120,120,255, 200,200,200,255, 255,255,255,255]);
  const t = new THREE.DataTexture(d, 3, 1); t.minFilter = t.magFilter = THREE.NearestFilter; t.needsUpdate = true; return t;
})();
const matCache = new Map();
function M(color, extra){
  const key = color + (extra ? JSON.stringify(extra) : '');
  if (!extra && matCache.has(key)) return matCache.get(key);
  const m = new THREE.MeshToonMaterial({color, gradientMap:grad, ...(extra||{})});
  if (!extra) matCache.set(key, m);
  return m;
}
function mesh(geo, mat, x=0, y=0, z=0, shadow=true){
  const m = new THREE.Mesh(geo, mat); m.position.set(x,y,z);
  m.castShadow = shadow; m.receiveShadow = true; return m;
}
const G = {
  sph: (r,w=14,h=10) => new THREE.SphereGeometry(r,w,h),
  cyl: (a,b,h,s=14) => new THREE.CylinderGeometry(a,b,h,s),
  box: (x,y,z) => new THREE.BoxGeometry(x,y,z),
  cone:(r,h,s=10) => new THREE.ConeGeometry(r,h,s),
};
function shade(hex, f){ const c = new THREE.Color(hex); c.offsetHSL(0, 0, f); return c.getHex(); }

function makeAnimal(sp, color, opt={}){
  const g = new THREE.Group(), rig = new THREE.Group(); g.add(rig);
  const c = M(color), lt = M(shade(color,.12)), dk = M(0x3a2a2a), pink = M(0xf7a6b4);
  const body = mesh(G.sph(.48), c, 0,.68,0); body.scale.set(1,1.1,.92); rig.add(body);
  const belly = mesh(G.sph(.36), lt, 0,.62,.2); belly.scale.set(1,1.05,.7); rig.add(belly);
  const head = new THREE.Group(); head.position.y = 1.45; rig.add(head);
  head.add(mesh(G.sph(.55,18,14), c));
  const muz = mesh(G.sph(.2), lt, 0,-.1,.44); muz.scale.set(1.35,.9,.8); head.add(muz);
  if (sp==='fox'){ muz.scale.set(1.1,.8,1.5); muz.position.z=.48; }
  head.add(mesh(G.sph(.075,8,6), dk, 0, -.03, sp==='fox'?.72:.6, false));
  for (const s of [-1,1]){
    head.add(mesh(G.sph(.075,10,8), dk, s*.2, .1, .47, false));
    const bl = mesh(G.sph(.09,8,6), pink, s*.33,-.07,.4,false); bl.scale.set(1,.55,.4); head.add(bl);
    let ear;
    if (sp==='rabbit'){ ear = mesh(G.sph(.14), c, s*.2,.62,-.02); ear.scale.set(1,3.1,.7); ear.rotation.z = -s*.15;
      const inn = mesh(G.sph(.08), pink, 0,0,.08,false); inn.scale.set(1,.85,.5); ear.add(inn); }
    else if (sp==='bear'){ ear = mesh(G.sph(.17), c, s*.38,.38,-.02); const inn = mesh(G.sph(.09), lt,0,0,.1,false); ear.add(inn); }
    else if (sp==='squirrel'){ ear = mesh(G.cone(.12,.28,6), c, s*.3,.5,0); ear.rotation.z = -s*.25; }
    else { ear = mesh(G.cone(.18,.36,4), c, s*.32,.5,0); ear.rotation.z = -s*.35; ear.rotation.y = Math.PI/4; }
    head.add(ear);
  }
  let tail;
  if (sp==='fox'){ tail = mesh(G.sph(.22), c, 0,.55,-.55); tail.scale.set(1,1,2.2); tail.rotation.x = .7;
    const tip = mesh(G.sph(.16), M(0xfff6ea), 0,0,-.2); tail.add(tip); }
  else if (sp==='squirrel'){ tail = mesh(G.sph(.3), M(shade(color,-.05)), 0,1.0,-.55); tail.scale.set(.85,1.9,.7); tail.rotation.x=-.3; }
  else if (sp==='cat'){ tail = mesh(G.cyl(.06,.08,.9,8), c, 0,.7,-.5); tail.rotation.x = -.6; }
  else tail = mesh(G.sph(.15), lt, 0,.5,-.45);
  rig.add(tail);
  const arms = [], feet = [];
  for (const s of [-1,1]){
    const a = mesh(G.sph(.14), c, s*.47,.78,.08); rig.add(a); arms.push(a);
    const f = mesh(G.sph(.16), c, s*.2,.12,.06); f.scale.set(1,.6,1.3); rig.add(f); feet.push(f);
  }
  if (opt.baker){
    const ap = mesh(G.cyl(.47,.5,.62,16,1), M(0xffffff), 0,.62,.03); ap.scale.set(1,1,.92); rig.add(ap);
    const hat = new THREE.Group(); hat.position.set(0,.5,-.02); head.add(hat);
    hat.add(mesh(G.cyl(.3,.3,.25,14), M(0xffffff), 0,0,0));
    for (const [x,z] of [[-.15,0],[.15,0],[0,.08],[0,-.1]]) hat.add(mesh(G.sph(.2), M(0xffffff), x,.22,z));
    if (sp==='rabbit') head.children.filter(o=>o.scale.y>3).forEach(e=>{e.position.y=.5;e.position.x*=1.6;e.rotation.z*=3;});
  }
  if (opt.scarf){ const sc = mesh(new THREE.TorusGeometry(.33,.09,8,16), M(opt.scarf), 0,1.0,0); sc.rotation.x = Math.PI/2; rig.add(sc); }
  const hand = new THREE.Group(); hand.position.set(0,.95,.62); rig.add(hand);
  g.userData = {rig, arms, feet, head, hand, t:Math.random()*10};
  return g;
}
function animateAnimal(a, moving, dt){
  const u = a.userData; u.t += dt*(moving?12:3);
  u.rig.position.y = moving ? Math.abs(Math.sin(u.t))*.09 : Math.sin(u.t)*.015;
  u.feet[0].position.z = .06 + (moving? Math.sin(u.t)*.18:0);
  u.feet[1].position.z = .06 - (moving? Math.sin(u.t)*.18:0);
  u.arms[0].position.y = .78 + (moving? Math.sin(u.t)*.05:0);
  u.arms[1].position.y = .78 - (moving? Math.sin(u.t)*.05:0);
  u.head.rotation.z = moving ? 0 : Math.sin(u.t*.5)*.05;
}

function makeBread(type, done='good', tops=[]){
  const g = new THREE.Group();
  const base = {raw:0xf3dcae, good:0xe0a45a, perfect:0xd98b3a, burnt:0x6e4630}[done] || 0xe0a45a;
  const b = M(base), lt = M(shade(base,.12));
  let topY = .2;
  switch(type){
    case 'loaf': g.add(mesh(G.box(.5,.3,.36), b,0,.15,0)); { const t = mesh(G.cyl(.18,.18,.5,12), lt,0,.3,0); t.rotation.z=Math.PI/2; t.scale.set(1,1,1); g.add(t);} topY=.45; break;
    case 'croissant': { const t = mesh(new THREE.TorusGeometry(.22,.12,10,16,Math.PI*1.25), b,0,.12,0); t.rotation.x=Math.PI/2; t.rotation.z=-.4; g.add(t);} topY=.24; break;
    case 'bagel': { const t = mesh(new THREE.TorusGeometry(.2,.1,10,18), b,0,.1,0); t.rotation.x=Math.PI/2; g.add(t);} topY=.2; break;
    case 'donut': { const t = mesh(new THREE.TorusGeometry(.2,.12,10,18), b,0,.12,0); t.rotation.x=Math.PI/2; g.add(t);} topY=.24; break;
    case 'cookie': g.add(mesh(G.cyl(.25,.25,.07,16), b,0,.04,0)); for (let i=0;i<4;i++) g.add(mesh(G.sph(.04,6,4),M(0x5b3520),Math.cos(i*1.6)*.13,.08,Math.sin(i*1.6)*.13)); topY=.1; break;
    case 'cupcake': g.add(mesh(G.cyl(.2,.14,.22,12), M(0xf7b7c8),0,.11,0)); g.add(mesh(G.sph(.22), b,0,.26,0)); topY=.46; break;
    case 'pretzel': { const t = mesh(new THREE.TorusKnotGeometry(.15,.05,40,6,2,3), b,0,.12,0); t.scale.set(1.2,1.2,.6); t.rotation.x=Math.PI/2; g.add(t);} topY=.2; break;
    case 'pie': g.add(mesh(G.cyl(.3,.24,.14,16), b,0,.07,0)); g.add(mesh(G.cyl(.25,.25,.02,16), M(0xb33a4a),0,.145,0)); topY=.17; break;
    case 'cake': { const c = mesh(G.cyl(.3,.3,.3,3), M(0xfff1dc),0,.15,0); c.rotation.y=Math.PI/6; g.add(c);
      const l = mesh(G.cyl(.31,.31,.05,3), b,0,.15,0); l.rotation.y=Math.PI/6; g.add(l);} topY=.32; break;
  }
  tops.forEach((t, i) => {
    const col = TOPS[t].color, off = i*.06;
    if (t==='berry'){ const s = mesh(G.cone(.07,.13,8), M(col),.04-off,topY+.06,0); s.rotation.x=Math.PI; g.add(s); }
    else if (t==='blue'){ for (let k=0;k<3;k++) g.add(mesh(G.sph(.045,8,6), M(col), Math.cos(k*2.1)*.09, topY+.03+off, Math.sin(k*2.1)*.09)); }
    else if (t==='cream'){ g.add(mesh(G.cone(.11,.16,10), M(col),0,topY+.08+off,0)); }
    else if (t==='sprink'){ for (let k=0;k<8;k++){ const s = mesh(G.box(.05,.015,.015), M([0xff8fd0,0x7fd3ff,0xffe066,0x9be38a][k%4]), Math.cos(k)*.13, topY+off, Math.sin(k*1.7)*.13, false); s.rotation.y=k; g.add(s);} }
    else { const s = mesh(G.sph(.2,12,6,), M(col, t==='honey'?{transparent:true,opacity:.8}:undefined), 0,topY-.08+off,0, false); s.scale.set(1.05,.25,1.05); g.add(s); }
  });
  return g;
}

function makeTree(round=true, scale=1){
  const g = new THREE.Group();
  g.add(mesh(G.cyl(.14,.2,1,8), M(0x8b5e3c),0,.5,0));
  if (round){ const c = [0x7cc06a,0x8ccc72,0x6db35f];
    g.add(mesh(G.sph(.8,12,10), M(c[0]),0,1.55,0)); g.add(mesh(G.sph(.55,10,8), M(c[1]),.45,1.3,.2)); g.add(mesh(G.sph(.5,10,8), M(c[2]),-.4,1.35,-.15)); }
  else { g.add(mesh(G.cone(.85,1.3,8), M(0x5aa36a),0,1.4,0)); g.add(mesh(G.cone(.62,1.0,8), M(0x6bb579),0,2.0,0)); g.add(mesh(G.cone(.38,.7,8), M(0x7cc487),0,2.5,0)); }
  g.scale.setScalar(scale); return g;
}

function patTex(def, rx, ry){
  const key = def.name+rx+ry; if (texCache.has(key)) return texCache.get(key);
  const c = document.createElement('canvas'); c.width = c.height = 128; const x = c.getContext('2d');
  x.fillStyle = def.base; x.fillRect(0,0,128,128); x.fillStyle = def.acc || def.base; x.strokeStyle = def.acc || def.base;
  if (def.pat==='stripe') for (let i=0;i<128;i+=32) x.fillRect(i,0,14,128);
  if (def.pat==='dot') for (let i=0;i<4;i++) for (let j=0;j<4;j++){ x.beginPath(); x.arc(16+i*32+(j%2)*16,16+j*32,6,0,7); x.fill(); }
  if (def.pat==='check') for (let i=0;i<4;i++) for (let j=0;j<4;j++) if ((i+j)%2) x.fillRect(i*32,j*32,32,32);
  if (def.pat==='flower') for (let i=0;i<3;i++) for (let j=0;j<3;j++){ const cx=22+i*42+(j%2)*20, cy=22+j*42; for (let k=0;k<5;k++){ x.beginPath(); x.arc(cx+Math.cos(k*1.26)*6, cy+Math.sin(k*1.26)*6, 4.5, 0, 7); x.fill(); } x.fillStyle='#ffe680'; x.beginPath(); x.arc(cx,cy,3,0,7); x.fill(); x.fillStyle=def.acc; }
  if (def.pat==='plank'){ x.lineWidth = 3; for (let i=0;i<=128;i+=32){ x.beginPath(); x.moveTo(i,0); x.lineTo(i,128); x.stroke(); } for (let i=0;i<4;i++){ x.beginPath(); x.moveTo(i*32, (i*47)%128); x.lineTo(i*32+32,(i*47)%128); x.stroke(); } }
  if (def.pat==='tile'){ x.lineWidth = 4; for (let i=0;i<=128;i+=64){ x.beginPath(); x.moveTo(i,0); x.lineTo(i,128); x.stroke(); x.beginPath(); x.moveTo(0,i); x.lineTo(128,i); x.stroke(); } }
  if (def.pat==='star') for (let i=0;i<9;i++){ const sx=(i*53)%128, sy=(i*37+11)%128; x.beginPath(); for (let k=0;k<10;k++){ const r = k%2?2.5:6, a = k*Math.PI/5-Math.PI/2; x.lineTo(sx+Math.cos(a)*r, sy+Math.sin(a)*r); } x.fill(); }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx, ry); texCache.set(key, t); return t;
}

function collide(x, z, r){
  if (area==='in'){
    const hs = roomHalf(viewData) - .4;
    for (const c of roomColliders){ const dx = x-c.x, dz = z-c.z, d = Math.hypot(dx,dz), m = r + c.r; if (d < m && d > 1e-4){ x = c.x + dx/d*m; z = c.z + dz/d*m; } }
    x = Math.max(ROOM.x-hs, Math.min(ROOM.x+hs, x)); z = Math.max(ROOM.z-hs, Math.min(ROOM.z+hs+.3, z));
    return [x,z];
  }
  for (const c of colliders.concat(decoColliders, cafeColliders)){
    if (c.box){ const b = c.box; const nx = Math.max(b.minX, Math.min(x, b.maxX)), nz = Math.max(b.minZ, Math.min(z, b.maxZ));
      const dx = x-nx, dz = z-nz, d = Math.hypot(dx,dz);
      if (d < r){ if (d < 1e-4){ z = b.maxZ + r; } else { x = nx + dx/d*r; z = nz + dz/d*r; } } }
    else { const dx = x-c.x, dz = z-c.z, d = Math.hypot(dx,dz), m = r + c.r; if (d < m && d > 1e-4){ x = c.x + dx/d*m; z = c.z + dz/d*m; } }
  }
  const d = Math.hypot(x,z); if (d > WORLD_R){ x *= WORLD_R/d; z *= WORLD_R/d; }
  return [x,z];
}

function onTap(cx, cy){
  if (paused || !player) return;
  raycaster.setFromCamera({x:cx/innerWidth*2-1, y:-(cy/innerHeight)*2+1}, camera);
  const p = new THREE.Vector3(); if (!raycaster.ray.intersectPlane(groundPlane, p)) return;
  // 화면에서 가까운 설비/동물을 먼저 찾기
  let best = null, bd = 1e9;
  for (const t of tapTargets()){
    _v.set(0, t.h ?? .8, 0); t.o.localToWorld(_v); _v.project(camera);
    const sx = (_v.x+1)/2*innerWidth, sy = (1-_v.y)/2*innerHeight, d = Math.hypot(sx-cx, sy-cy);
    const wp = t.o.getWorldPosition ? t.o.getWorldPosition(new THREE.Vector3()) : t.o.position; t.wp = wp;
    const gd = Math.hypot(p.x - wp.x, p.z - wp.z);
    const score = Math.min(d/60, gd/t.r);
    if (score < 1 && score < bd){ bd = score; best = t; }
  }
  if (best){
    const x = best.x ?? best.o.position.x, z = best.z ?? best.o.position.z;
    moveTarget = {x, z, act:true, stuck:0, lastD:1e9, npc:best.npc||null, plot:best.plot};
  } else moveTarget = {x:p.x, z:p.z, act:false, stuck:0, lastD:1e9};
  tapRing.position.set(moveTarget.act ? best.wp.x : p.x, .05, moveTarget.act ? best.wp.z : p.z);
  tapRing.material.opacity = .9; tapRing.scale.setScalar(1);
  SFX.pop();
}

let ghost = null;
const raycaster = new THREE.Raycaster(), groundPlane = new THREE.Plane(new THREE.Vector3(0,1,0), 0);
const decoList = () => area==='in' ? S.room : S.placed;
const itemFits = id => area==='in' ? (ITEMS[id].room || id==='pot' || id==='pumpkin' || id==='mushroom') : !ITEMS[id].room;
function startDeco(item=null){
  if (mode!=='home') return;
  if (item && !itemFits(item)){ toast(area==='in' ? '이건 밖에 놓는 물건이에요. 밖에서 꾸며요' : '가구는 집 안에서 놓을 수 있어요 🏠'); item = null; }

  $('decobar').classList.add('show'); setGhost();
  toast(item ? '놓을 곳으로 가서(또는 땅을 눌러서) [놓기]를 눌러요' : '물건 가까이 가서 [치우기]로 가방에 넣을 수 있어요');
}
function endDeco(){ deco = null; setGhost(); $('decobar').classList.remove('show'); markDirty(); }
function setGhost(){
  if (ghost){ world.remove(ghost); ghost = null; }
  if (!deco || !deco.item) return;
  ghost = makeItem(deco.item); ghost.userData.isGhost = true; ghost.traverse(o => { if (o.isMesh){ o.material = o.material.clone(); o.material.transparent = true; o.material.opacity = .6; o.castShadow = false; } });

function placeGhostAtScreen(cx, cy){
  raycaster.setFromCamera({x:cx/innerWidth*2-1, y:-(cy/innerHeight)*2+1}, camera);
  const p = new THREE.Vector3(); if (!raycaster.ray.intersectPlane(groundPlane, p)) return;

}
function ghostValid(x, z){
  if (area==='in'){ const hs = roomHalf(S) - .5, lx = x-ROOM.x, lz = z-ROOM.z;
    if (Math.abs(lx) > hs || Math.abs(lz) > hs) return false;
    if (lz > hs-1 && Math.abs(lx) < 1.1) return false; // 문 앞
    if (ITEMS[deco.item].r) for (const p of S.room) if (ITEMS[p.id].r && Math.hypot(lx-p.x, lz-p.z) < ITEMS[deco.item].r + ITEMS[p.id].r - .1) return false;
    return true; }
  if (Math.hypot(x,z) > WORLD_R-.5) return false;
  if (Math.abs(x-GARDEN.x) < 2.6 && Math.abs(z-GARDEN.z) < 3) return false; // 텃밭
  if (x > CAFE.x-3 && x < CAFE.x+3 && z > CAFE.z-3 && z < CAFE.z+5) return false; // 카페
  if (Math.abs(x-MYHOUSE.x) < 3 && z > MYHOUSE.z-2.8 && z < MYHOUSE.z+4.2) return false; // 내 집
  if (x > -7 && x < 7 && z > -14 && z < -1.2) return false; // 빵집 앞마당
  if (Math.hypot(x+3, z-1.8) < 1) return false;
  for (const c of decoColliders) if (Math.hypot(x-c.x, z-c.z) < c.r + (ITEMS[deco.item].r||.3)) return false;
  for (const p of S.placed) if (Math.hypot(x-p.x, z-p.z) < .7) return false;
  return true;
}
function nearestPlaced(){
  let best = -1, bd = 1.8; const ox = area==='in'?ROOM.x:0, oz = area==='in'?ROOM.z:0;
  decoList().forEach((p,i) => { const d = Math.hypot(P.x-ox-p.x, P.z-oz-p.z); if (d < bd){ bd = d; best = i; } });
  return best;
}
function decoAction(){
  if (deco.item){
    const x = deco.gx, z = deco.gz;
    if (!ghostValid(x,z)){ toast('여기에는 놓을 수 없어요'); SFX.sad(); return; }
    if (area==='in') S.room.push({id:deco.item, x:x-ROOM.x, z:z-ROOM.z, r:deco.rot}); else S.placed.push({id:deco.item, x, z, r:deco.rot});

}

    if (pouring){ lvl = Math.min(1.05, lvl + dt*(.35 + lvl*.25)); liq.style.height = Math.min(100, lvl*100)+'%'; if (lvl >= 1.05) finish(); }
    requestAnimationFrame(loop); };

    const q = lvl >= lo && lvl <= hi ? 'perfect' : (lvl >= lo-.1 && lvl <= hi+.08) ? 'good' : 'meh';

}

function updateStaff(n, dt){

  } else {
    if (n.state==='toOven'){ moving = !goTo(OVEN_STAND[0], OVEN_STAND[1]); if (!moving){ n.state = 'baking'; n.wait = W.bake; o.rotation.y = Math.atan2(oven.position.x-o.position.x, oven.position.z-o.position.z); n.bubble = mkLabel('bubble say', '🔥 굽는 중'); } }
    else if (n.state==='baking'){ n.wait -= dt; if (n.wait <= 0){ n.bread = {type:n.job.order.type, done: Math.random()<W.perfect ? 'perfect' : 'good', tops:[]};
        o.userData.hand.clear(); o.userData.hand.add(makeBread(n.bread.type, n.bread.done));
        n.state = n.job.order.tops.length ? 'toDeco' : 'toCounter'; n.bubble?.remove(); n.bubble = null; } }
    else if (n.state==='toDeco'){ moving = !goTo(DECO_STAND[0], DECO_STAND[1]); if (!moving){ n.state = 'decorating'; n.wait = W.bake*.5; n.bubble = mkLabel('bubble say', '🎨 장식 중'); } }
    else if (n.state==='decorating'){ n.wait -= dt; if (n.wait <= 0){ n.bread.tops = [...n.job.order.tops]; o.userData.hand.clear(); o.userData.hand.add(makeBread(n.bread.type, n.bread.done, n.bread.tops)); n.state='toCounter'; n.bubble?.remove(); n.bubble = null; } }
    else if (n.state==='toCounter'){ moving = !goTo(Math.max(-1.6, Math.min(1.6, n.job.obj.position.x)), -4.0); if (!moving){ o.userData.hand.clear(); sellTo(n.job, n.bread, n); n.job = null; n.state = 'idle'; } }
  }

const skyDay = new THREE.Color(0xcfe9f7), skyEve = new THREE.Color(0xffc9a8), skyNight = new THREE.Color(0x2c3561), tmpC = new THREE.Color();
function updateSky(){
  const d = new Date(), h = d.getHours() + d.getMinutes()/60;
  let night = 0, eve = 0;
  if (h >= 19.5 || h < 5) night = 1; else if (h >= 17.5) { eve = Math.min(1,(h-17.5)/1); night = Math.max(0,(h-18.5)/1); } else if (h < 6.5) { night = 1-(h-5)/1.5; eve = night*.6; }
  tmpC.copy(skyDay).lerp(skyEve, eve).lerp(skyNight, night);
  scene.background.copy(tmpC); scene.fog.color.copy(tmpC);
  hemi.intensity = 1.15 - night*.55; sun.intensity = 1.5 - night*1.1;
  sun.color.setHex(eve > .3 && night < .5 ? 0xffc79a : night > .5 ? 0x9fb0ff : 0xfff0d6);
  const glow = night > .3 ? .9 : 0;
  windowMats.forEach(m => m.emissiveIntensity = glow);
  world.traverse(o => { if (o.userData.glow) o.material.emissiveIntensity = .3 + glow; if (o.userData.window) o.material.emissiveIntensity = glow*.9; });
}

let last = performance.now(), skyT = 0, gardenT = 0;
function tick(now){
  requestAnimationFrame(tick);
  const dt = Math.min(.1, (now-last)/1000); last = now;
  if (!player){ renderer.render(scene, camera); return; }
  if (!paused){
    // 이동
    let ix = (keys.KeyD||keys.ArrowRight?1:0) - (keys.KeyA||keys.ArrowLeft?1:0) + joyV.x;
    let iz = (keys.KeyS||keys.ArrowDown?1:0) - (keys.KeyW||keys.ArrowUp?1:0) + joyV.y;
    { const sy = Math.sin(camYaw), cy = Math.cos(camYaw), kx = ix, kz = iz; ix = kx*cy + kz*sy; iz = -kx*sy + kz*cy; }
    let il = Math.hypot(ix, iz); if (il > 1){ ix/=il; iz/=il; }
    if (il > .1) moveTarget = null;
    else if (moveTarget){
      if (moveTarget.npc && moveTarget.x===null){ }
      const tx = moveTarget.npc && moveTarget.npc.kind!=='customer' ? moveTarget.npc.obj.position.x : moveTarget.x;
      const tz = moveTarget.npc && moveTarget.npc.kind!=='customer' ? moveTarget.npc.obj.position.z : moveTarget.z;
      const dx = tx-P.x, dz = tz-P.z, dd = Math.hypot(dx,dz);
      const stopAt = moveTarget.npc && moveTarget.npc.kind!=='customer' ? 1.3 : .12;
      if (dd <= stopAt) arrive();
      else { ix = dx/dd; iz = dz/dd; if (dd < .6){ ix*=dd/.6; iz*=dd/.6; } il = Math.hypot(ix,iz);
        if (dd > moveTarget.lastD - .002) moveTarget.stuck += dt; else moveTarget.stuck = 0; moveTarget.lastD = dd;
        if (moveTarget.stuck > .35) arrive(); }
    }
    const sp = 6;
    let nx = P.x + ix*sp*dt, nz = P.z + iz*sp*dt;
    [nx, nz] = collide(nx, nz, .45); P.x = nx; P.z = nz;
    const moving = il > .1;
    if (moving){ const tr = Math.atan2(ix, iz); let dr = tr - P.rot; dr = Math.atan2(Math.sin(dr), Math.cos(dr)); P.rot += dr*Math.min(1, dt*12); }
    player.position.set(P.x, 0, P.z); player.rotation.y = P.rot; animateAnimal(player, moving, dt);
    // 손님 생성
    if (mode==='home'){ spawnT -= dt; if (spawnT <= 0){ spawnCustomer(); spawnT = 9 + Math.random()*9 - Math.min(5, S.level*.6); } }
  }
  // NPC
  for (const n of [...npcs]){
    const o = n.obj; let moving = false;
    if (n.kind==='staff'){ if (!paused) updateStaff(n, dt); continue; }
    if (n.kind==='customer'){
      if (n.state==='walk' || n.state==='leave'){
        const dx = n.tx-o.position.x, dz = n.tz-o.position.z, dd = Math.hypot(dx,dz);
        if (dd > .1){ const s = Math.min(dd, 4.2*dt); o.position.x += dx/dd*s; o.position.z += dz/dd*s; o.rotation.y = Math.atan2(dx,dz); moving = true; }
        else if (n.state==='walk'){ n.state='wait'; if (area==='in' && mode==='home') toast(`🔔 ${n.A.name}이(가) 빵집에 왔어요!`); o.rotation.y = Math.hypot(P.x-o.position.x, P.z-o.position.z) < 7 ? Math.atan2(P.x-o.position.x, P.z-o.position.z) : Math.PI; SFX.ding(); n.bubble.style.display=''; }
        else { // 떠남 완료
          if (n.resident){ n.kind='resident'; n.busy=false; n.resident.busy=false; const i = npcs.indexOf(n); npcs.splice(i,1); n.resident.label.style.display='';
            const h = o.userData.hand; h.clear(); n.resident.tx=n.tx; n.resident.tz=n.tz; }
          else removeNpc(n);
          continue;
        }
      } else if (n.state==='wait' && !paused){
        n.patience -= dt; o.rotation.y = Math.hypot(P.x-o.position.x, P.z-o.position.z) < 7 ? Math.atan2(P.x-o.position.x, P.z-o.position.z) : Math.PI;
        if (n.patience <= 0){ customerLeave(n, false); SFX.sad(); continue; }
      }
      if (n.bubble){ n.bubble.innerHTML = `${n.claimed?'<small style="font-size:12px">🧑‍🍳</small>':''}${orderHtml(n.order)}<div class="pb"><i style="width:${n.patience/n.maxP*100}%;background:${n.patience/n.maxP<.3?'var(--red)':'var(--green)'}"></i></div>`; placeLabel(n.bubble, o, 2.6); }
    } else if (n.kind==='resident'){
      if (n.busy) { continue; }
      n.wait -= dt;
      const dx = n.tx-o.position.x, dz = n.tz-o.position.z, dd = Math.hypot(dx,dz);
      if (dd > .15){ const s = Math.min(dd, 1.6*dt); o.position.x += dx/dd*s; o.position.z += dz/dd*s; o.rotation.y = Math.atan2(dx,dz); moving = true; }
      else if (n.wait <= 0){ const a = Math.random()*Math.PI*2, r = 1.5+Math.random()*3.5; n.tx = n.home[0]*.8 + Math.cos(a)*r; n.tz = n.home[1]*.8 + Math.sin(a)*r; n.wait = 2+Math.random()*4; }
      placeLabel(n.label, o, 2.35);
    } else if (n.kind==='owner'){ o.rotation.y = Math.atan2(P.x-o.position.x, P.z-o.position.z); placeLabel(n.label, o, 2.6); }

  }
  // 꾸미기 고스트
  if (deco && deco.item && ghost){
    if (!deco.manual){ deco.gx = Math.round((P.x + Math.sin(P.rot)*1.8)*2)/2; deco.gz = Math.round((P.z + Math.cos(P.rot)*1.8)*2)/2; }
    ghost.position.set(deco.gx, .02, deco.gz); ghost.rotation.y = deco.rot*Math.PI/2;
    const ok = ghostValid(deco.gx, deco.gz); ghost.traverse(o => { if (o.isMesh) o.material.opacity = ok ? .65 : .25; });
    if (Math.hypot(ix0(),iz0())>.1) deco.manual = false;
  }
  if (tapRing.material.opacity > 0){ tapRing.material.opacity = Math.max(0, tapRing.material.opacity - dt*1.5); tapRing.scale.multiplyScalar(1 + dt*.8); }
  // 장식 애니메이션
  decoGroup.traverse(o => { if (o.userData.spin2) o.rotation.z += dt*.8; if (o.userData.spin) o.position.y = 1.55 + Math.sin(now/300)*.06; });
  smoke.forEach(s => { s.userData.t = (s.userData.t + dt*.18) % 1; const t = s.userData.t; s.position.set(3.2 + Math.sin(t*6)*.3, 7.3 + t*4, -10.6); s.scale.setScalar(.5 + t*1.2); s.material.opacity = .65*(1-t); });
  // 행동 버튼
  if (!paused){ const a = computeAction(); currentAction = a; if (a){ actionBtn.textContent = a.label; actionBtn.classList.add('show'); } else actionBtn.classList.remove('show'); }
  else actionBtn.classList.remove('show');
  if (cafeLabel && cafeLabel.style.display !== 'none') placeLabel(cafeLabel, cafeSign, 2.6);
  // 텃밭 성장, 알바 남은 시간
  gardenT -= dt; if (gardenT <= 0){ gardenT = 2; buildGarden(viewData);
    const ab = staffActive('bakery'), ac = staffActive('cafe'), cnt = (ab?1:0)+(ac?1:0);
    $('staffT').textContent = cnt ? `${cnt}명 근무` : '알바';
    if (mode==='home'){ if (ab && !staffNpcs.bakery) spawnStaff('bakery'); if (ac && !staffNpcs.cafe && S.cafe.open) spawnStaff('cafe'); } }
  roomDecoGroup.traverse(o => { if (o.userData.fish !== undefined){ const t = now/1000 + o.userData.fish*2; o.position.x = Math.sin(t)*.32; o.rotation.y = Math.cos(t) > 0 ? 0 : Math.PI; }
    if (o.userData.fire !== undefined) o.scale.y = 1 + Math.sin(now/90 + o.userData.fire*2)*.2; });
  plots.forEach(g => g.traverse(o => { if (o.userData.ripe) o.position.y = .12 + Math.abs(Math.sin(now/400))*.04; }));
  roomDecoGroup.traverse(o => { if (o.userData.swing) o.position.x = Math.sin(now/500)*.12; });
  // 카메라
  const tx = P.x, tz = P.z, cz = area==='in' ? camZoom*.62 : camZoom;
  camYaw += (camYawT - camYaw) * Math.min(1, dt*8);
  const sy = Math.sin(camYaw), cy = Math.cos(camYaw);
  camera.position.lerp(_v.set(tx + sy*12.5*cz, 13*cz, tz + cy*12.5*cz), Math.min(1, dt*6));
  camera.lookAt(tx - sy, 1, tz - cy);
  if (area==='in'){ const vx = camera.position.x-ROOM.x, vz = camera.position.z-ROOM.z, vl = Math.hypot(vx,vz)||1;
    for (const w of roomWalls) w.visible = (w.userData.n[0]*vx + w.userData.n[1]*vz)/vl < .35; }
  sun.position.set(tx + 10, 22, tz + 8); sun.target.position.set(tx, 0, tz);
  skyT -= dt; if (skyT <= 0){ updateSky(); skyT = 30; }
  renderer.render(scene, camera);
}

const iz0 = () => (keys.KeyS||keys.ArrowDown?1:0) - (keys.KeyW||keys.ArrowUp?1:0) + joyV.y;

    if (mode!=='home') return toast('집에서 바꿀 수 있어요');
    const order = Object.keys(SPECIES); S.species = order[(order.indexOf(S.species)+1)%order.length]; buildPlayer(); markDirty(); toast(`${SPECIES[S.species]}(으)로 바꿨어요! 한 번 더 누르면 또 바뀌어요`);
  };
  const out = m.querySelector('#mOut'); if (out) out.onclick = async () => { markDirty(); await saveRemote(true); await sb.auth.signOut(); location.reload(); };
  const inn = m.querySelector('#mIn'); if (inn) inn.onclick = () => { closeModal(true); paused = true; showTitle(); };
};
